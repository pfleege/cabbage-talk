services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gardening}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gardening_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gardening}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gardening} -d ${POSTGRES_DB:-gardening}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gardening}:${POSTGRES_PASSWORD:-gardening_dev_password}@db:5432/${POSTGRES_DB:-gardening}
    ports:
      - "3000:3000"

volumes:
  pgdata:
